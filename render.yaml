services:
  - type: web
    name: lyzer-edge
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: ARL_MODE
        value: TESTNET
      - key: LIVE_TRADING_ENABLED
        value: false
      - key: MAX_DAILY_CAPITAL
        value: 1000
