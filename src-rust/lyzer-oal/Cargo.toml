[package]
name = "lyzer-oal"
version = "0.1.0"
edition = "2021"
description = "Observation Acquisition Layer for Lyzer Labs"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
tungstenite = "0.20"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parquet = "49.0"
arrow = "49.0"
chrono = "0.4"
