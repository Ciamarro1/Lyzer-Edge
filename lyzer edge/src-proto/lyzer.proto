syntax = "proto3";

package lyzer;

// The origin of all causal traceability.
message ExecutionIntent {
  string execution_intent_id = 1; // UUIDv7
  string correlation_id = 2; // UUIDv7
  string causation_id = 3; // UUIDv7
  string strategy_id = 4;
  string cluster_id = 5;
  string symbol = 6;
  string side = 7; // "BUY" or "SELL"
  double quantity = 8;
  string order_type = 9; // "MARKET", "LIMIT"
  double price = 10; // Optional, used for LIMIT
  int64 timestamp_ms = 11;
}

// Command sent to Risk Gateway for authorization
message AuthorizeOrder {
  string execution_intent_id = 1; // UUIDv7
  string correlation_id = 2; // UUIDv7
  string causation_id = 3; // UUIDv7
  ExecutionIntent intent = 4;
  int64 request_timestamp_ms = 5;
}

// Response from Risk Gateway
message RiskDecision {
  string execution_intent_id = 1; // UUIDv7
  string correlation_id = 2; // UUIDv7
  string causation_id = 3; // UUIDv7
  bool approved = 4;
  string rejection_reason = 5; // E.g., "Hard Cap Exceeded", empty if approved
  int64 decision_timestamp_ms = 6;
}

// Issued by OMS / Exchange Gateway via NATS (Execution Plane)
message ExecutionReport {
  string execution_intent_id = 1; // UUIDv7
  string correlation_id = 2; // UUIDv7
  string causation_id = 3; // UUIDv7
  string order_id = 4; // Exchange assigned order ID
  string status = 5; // PENDING, ACK, PARTIAL, FILLED, REJECTED, CANCELLED, ZOMBIE
  double filled_quantity = 6;
  double average_fill_price = 7;
  int64 timestamp_ms = 8;
}

// Issued by Position Manager via NATS (Position Plane)
message PositionUpdate {
  string execution_intent_id = 1; // UUIDv7 (the intent that caused this update)
  string correlation_id = 2; // UUIDv7
  string causation_id = 3; // UUIDv7
  string symbol = 4;
  double new_position_size = 5;
  double average_entry_price = 6;
  int64 timestamp_ms = 7;
}

// Intent Registry API
message RegisterIntentRequest {
  ExecutionIntent intent = 1;
}

message RegisterIntentResponse {
  string execution_intent_id = 1;
  string status = 2; // "CREATED"
  int32 version = 3; // 1
}

message AppendIntentEventRequest {
  string execution_intent_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  string event_type = 4; // "RISK_APPROVED", "RISK_REJECTED", "OMS_PENDING", etc.
  int32 event_schema_version = 5; // Sprint 0.6.3 EVENT_SCHEMA_DRIFT protection
  int32 expected_version = 6; // Sprint 0.6.2 CAUSAL_VERSION_LOCK
  string payload_json = 7;
}

message AppendIntentEventResponse {
  string execution_intent_id = 1;
  int32 new_version = 2;
}

message IntentEventRecord {
  string event_id = 1; // UUIDv7
  string execution_intent_id = 2;
  string event_type = 3;
  string correlation_id = 4;
  string causation_id = 5;
  int32 version = 6;
  int32 event_schema_version = 7;
  int64 timestamp_ms = 8;
  string payload_json = 9;
  int64 global_version = 10;
}

message AuditQueryRequest {
  string execution_intent_id = 1;
}

message AuditQueryResponse {
  repeated IntentEventRecord events = 1;
}

message AuditQuerySinceVersionRequest {
  int64 last_global_version = 1;
}

message AuditQuerySinceVersionResponse {
  repeated IntentEventRecord events = 1;
}

message GetMaxVersionRequest {
}

message GetMaxVersionResponse {
  int64 max_global_version = 1;
}

service RiskGateway {
  rpc Authorize(AuthorizeOrder) returns (RiskDecision);
}

service IntentRegistry {
  rpc RegisterIntent(RegisterIntentRequest) returns (RegisterIntentResponse);
  rpc AppendIntentEvent(AppendIntentEventRequest) returns (AppendIntentEventResponse);
  rpc AuditQuery(AuditQueryRequest) returns (AuditQueryResponse);
  rpc AuditQuerySinceVersion(AuditQuerySinceVersionRequest) returns (AuditQuerySinceVersionResponse);
  rpc GetMaxVersion(GetMaxVersionRequest) returns (GetMaxVersionResponse);
}