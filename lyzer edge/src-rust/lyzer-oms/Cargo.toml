[package]
name = "lyzer-oms"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.9"
prost = "0.11"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.8", features = ["v7"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-nats = { version = "0.33.0", default-features = false }
futures = "0.3"
bytes = "1.11.1"
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
tonic-build = "0.9"
