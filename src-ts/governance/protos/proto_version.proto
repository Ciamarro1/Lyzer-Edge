syntax = "proto3";

package lyzer.governance.cvp;

// Envelope de Versionamento Constitucional (CVP)
// Deve ser obrigatoriamente incluído em eventos do RIO, vetos do CML e payloads do ECA.
message ConstitutionalVersionEnvelope {
    uint32 epo_version = 1; // Major (Propósito)
    uint32 cso_version = 2; // Minor (Sobrevivência)
    uint32 ico_version = 3; // Patch (Capacidade/Runtime)
    string semantic_hash = 4; // Hash topológico exato da Constituição
}
