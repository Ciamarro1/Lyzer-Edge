name: Keep Lyzer Edge Space Awake

on:
  schedule:
    # Runs every 40 minutes to keep the Space from falling asleep
    - cron: '*/40 * * * *'
  workflow_dispatch: # Allows running manually from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space Endpoint
        run: |
          curl -sI https://jonatanciamarro-lyzer-edge.hf.space | head -n 1
